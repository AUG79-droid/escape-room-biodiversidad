name: Direct Open - GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Prepare site
        shell: bash
        run: |
          set +e
          rm -rf _site && mkdir -p _site
          BUILT=0
          if [ -f package.json ]; then
            npm ci || npm install
            if node -e "const p=require('./package.json'); process.exit((p.dependencies&&p.dependencies.vite)||(p.devDependencies&&p.devDependencies.vite)?0:1)"; then npm run build -- --base=./ && BUILT=1; else npm run build && BUILT=1; fi
          fi
          if [ "$BUILT" = "1" ] && [ -d dist ]; then rsync -a dist/ _site/; elif [ "$BUILT" = "1" ] && [ -d build ]; then rsync -a build/ _site/; elif [ "$BUILT" = "1" ] && [ -d out ]; then rsync -a out/ _site/; else rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='_site' ./ _site/; fi
          if [ ! -f _site/index.html ]; then python - <<'PY'
          from pathlib import Path
          import html
          root=Path('_site'); src=next((root/n for n in ('index.md','index.md.txt','README.md','README.txt') if (root/n).exists()),None)
          body=html.escape(src.read_text(errors='ignore') if src else 'Repository available on GitHub.')
          (root/'index.html').write_text('<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial;max-width:1000px;margin:40px auto;padding:20px;line-height:1.6;background:#081525;color:#eef6ff}pre{white-space:pre-wrap}</style><pre>'+body+'</pre>')
          PY
          fi
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
